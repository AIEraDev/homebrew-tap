name: Update Cask on Release

on:
  schedule:
    # Check for new Clypra releases every 4 hours automatically (zero tokens/secrets required)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Clypra release version to bump (e.g. 1.6.0 or v1.6.0). Leave blank to auto-detect latest.'
        required: false
        type: string
  repository_dispatch:
    types: [update-cask]

permissions:
  contents: write

jobs:
  update-cask:
    name: Check & Update Clypra Cask
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Resolve target version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            RAW_VERSION="${{ github.event.client_payload.version }}"
          else
            echo "Querying GitHub API for latest Clypra release..."
            RAW_VERSION=$(curl -sSL -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/AIEraDev/Clypra/releases/latest" | jq -r .tag_name)
          fi

          if [ -z "$RAW_VERSION" ] || [ "$RAW_VERSION" = "null" ]; then
            echo "Error: Could not determine Clypra release version."
            exit 1
          fi

          CLEAN_VERSION="${RAW_VERSION#v}"
          TAG="v${CLEAN_VERSION}"

          CURRENT_VERSION=$(grep -E 'version "' Casks/clypra.rb | head -n1 | sed -E 's/.*version "([^"]+)".*/\1/')
          echo "Current cask version: $CURRENT_VERSION"
          echo "Target release version: $CLEAN_VERSION"

          if [ "$CURRENT_VERSION" = "$CLEAN_VERSION" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Cask is already up to date with latest release ($CLEAN_VERSION). Skipping."
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_update=true" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download DMGs and compute SHA256 checksums
        if: steps.version.outputs.should_update == 'true'
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          BASE_URL="https://github.com/AIEraDev/Clypra/releases/download/${TAG}"

          echo "Downloading aarch64 DMG..."
          curl -fSL --retry 5 --retry-delay 10 -o "clypra_aarch64.dmg" "${BASE_URL}/Clypra_${VERSION}_aarch64.dmg"
          SHA_ARM=$(sha256sum clypra_aarch64.dmg | awk '{print $1}')
          echo "ARM64 SHA256: $SHA_ARM"

          echo "Downloading x64 (Intel) DMG..."
          curl -fSL --retry 5 --retry-delay 10 -o "clypra_x64.dmg" "${BASE_URL}/Clypra_${VERSION}_x64.dmg"
          SHA_INTEL=$(sha256sum clypra_x64.dmg | awk '{print $1}')
          echo "Intel SHA256: $SHA_INTEL"

          echo "sha_arm=$SHA_ARM" >> "$GITHUB_OUTPUT"
          echo "sha_intel=$SHA_INTEL" >> "$GITHUB_OUTPUT"

      - name: Generate updated Cask formula
        if: steps.version.outputs.should_update == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA_ARM="${{ steps.sha.outputs.sha_arm }}"
          SHA_INTEL="${{ steps.sha.outputs.sha_intel }}"

          cat > Casks/clypra.rb << CASKEOF
cask "clypra" do
  arch arm: "aarch64", intel: "x64"

  version "${VERSION}"
  sha256 arm:   "${SHA_ARM}",
         intel: "${SHA_INTEL}"

  url "https://github.com/AIEraDev/Clypra/releases/download/v#{version}/Clypra_#{version}_#{arch}.dmg"
  name "Clypra"
  desc "A modern, native video editor built with Tauri, React, and FFmpeg"
  homepage "https://github.com/AIEraDev/Clypra"

  app "Clypra.app"

  postflight do
    system_command "xattr",
                   args: ["-cr", "#{appdir}/Clypra.app"]
  end

  zap trash: [
    "~/Library/Application Support/com.clypra.editor",
    "~/Library/Application Support/com.deenminder.clypra",
    "~/Library/Caches/com.clypra.editor",
    "~/Library/Caches/com.deenminder.clypra",
    "~/Library/Preferences/com.clypra.editor.plist",
    "~/Library/Preferences/com.deenminder.clypra.plist",
    "~/Library/Saved Application State/com.clypra.editor.savedState",
  ]
end
CASKEOF

          echo "Generated Casks/clypra.rb:"
          cat Casks/clypra.rb

      - name: Commit and push changes
        if: steps.version.outputs.should_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/clypra.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(clypra): update cask to v${{ steps.version.outputs.version }}"
          git push
