name: Update Cask on Release

on:
  repository_dispatch:
    types: [update-cask]

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Get version from payload
        id: version
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          # Strip leading 'v' if present
          CLEAN_VERSION="${VERSION#v}"
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Updating cask to version: $CLEAN_VERSION"

      - name: Wait for release assets to be available
        run: sleep 30

      - name: Download DMG and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          BASE_URL="https://github.com/AIEraDev/Clypra/releases/download/${TAG}"

          echo "Downloading aarch64 DMG..."
          curl -fSL -o "clypra_aarch64.dmg" "${BASE_URL}/Clypra_${VERSION}_aarch64.dmg"
          SHA_ARM=$(shasum -a 256 clypra_aarch64.dmg | awk '{print $1}')
          echo "ARM64 SHA256: $SHA_ARM"

          echo "sha_arm=$SHA_ARM" >> "$GITHUB_OUTPUT"

      - name: Update Cask formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA_ARM="${{ steps.sha.outputs.sha_arm }}"

          cat > Casks/clypra.rb << 'CASKEOF'
          cask "clypra" do
            arch arm: "aarch64"

            version "VERSION_PLACEHOLDER"
            sha256 arm: "ARM_SHA_PLACEHOLDER"

            url "https://github.com/AIEraDev/Clypra/releases/download/v#{version}/Clypra_#{version}_#{arch}.dmg"
            name "Clypra"
            desc "A modern, native video editor built with Tauri, React, and FFmpeg"
            homepage "https://github.com/AIEraDev/Clypra"

            app "Clypra.app"

            postflight do
              system_command "xattr",
                             args: ["-cr", "#{appdir}/Clypra.app"]
            end

            zap trash: [
              "~/Library/Application Support/com.deenminder.clypra",
              "~/Library/Caches/com.deenminder.clypra",
              "~/Library/Preferences/com.deenminder.clypra.plist",
              "~/Library/Saved Application State/com.deenminder.clypra.savedState",
            ]
          end
          CASKEOF

          # Replace placeholders with actual values
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" Casks/clypra.rb
          sed -i '' "s/ARM_SHA_PLACEHOLDER/${SHA_ARM}/g" Casks/clypra.rb

          echo "Updated Cask formula:"
          cat Casks/clypra.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/clypra.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(clypra): update cask to v${{ steps.version.outputs.version }}"
          git push
